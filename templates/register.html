{% extends "base.html" %}{% block title %}Register - SimpleStore{% endblock %}{% block page %}register{% endblock %}
{% block content %}<section class="card auth"><h1>Create account</h1><form id="regform" novalidate><label>Full name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"><small>8+ characters with letters and numbers.</small></label><label>Confirm password<input name="confirm" type="password" required autocomplete="new-password"></label><label class="inline"><input type="checkbox" id="show"> Show passwords</label><p class="error" id="msg" role="alert"></p><button class="btn big">Register</button></form><p>Have an account? <a href="/login">Log in</a></p></section>{% endblock %}
{% block scripts %}<script src="/static/js/auth.js"></script>{% endblock %}
