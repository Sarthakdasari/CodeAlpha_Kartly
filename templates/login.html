{% extends "base.html" %}{% block title %}Login - SimpleStore{% endblock %}{% block page %}login{% endblock %}
{% block content %}<section class="card auth"><h1>Welcome back</h1><form id="loginform" novalidate><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><label class="inline"><input type="checkbox" id="show"> Show password</label><p class="error" id="msg" role="alert"></p><button class="btn big">Log in</button></form><p>New here? <a href="/register">Create an account</a></p></section>{% endblock %}
{% block scripts %}<script src="/static/js/auth.js"></script>{% endblock %}
